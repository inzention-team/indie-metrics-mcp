[project]
name = "indie-metrics-mcp"
version = "0.1.0"
description = "Read-only MCP server: App Store Connect, RevenueCat and PostHog numbers for your own apps, asked in Claude."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3", "pyjwt>=2.8", "cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
indie-metrics-mcp = "indie_metrics_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
